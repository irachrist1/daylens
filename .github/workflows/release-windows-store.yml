name: Build Windows Store Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store package version number
        required: true
      ref:
        description: Git ref to package, for example main or v1.0.35
        required: true
        default: main
      identity_name:
        description: Partner Center Package/Identity/Name
        required: true
      publisher:
        description: Partner Center Publisher value, for example CN=...
        required: true
      publisher_display_name:
        description: Store publisher display name
        required: true
        default: Daylens
      application_id:
        description: AppUserModelID application id
        required: true
        default: Daylens

permissions:
  contents: read

jobs:
  build-windows-store:
    timeout-minutes: 90
    runs-on: windows-latest
    env:
      DAYLENS_APPX_IDENTITY_NAME: ${{ inputs.identity_name }}
      DAYLENS_APPX_PUBLISHER: ${{ inputs.publisher }}
      DAYLENS_APPX_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      DAYLENS_APPX_APPLICATION_ID: ${{ inputs.application_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Stamp version into package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3,@paymoapp/active-window,keytar

      - name: Typecheck
        run: npm run typecheck

      - name: Build Vite bundles
        # Analytics/crash keys are compiled into the main bundle at build time;
        # without them every release ships with telemetry hard-disabled.
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          DAYLENS_BILLING_API_URL: ${{ secrets.DAYLENS_BILLING_API_URL }}
        run: npm run build:all

      - name: Package Windows Store AppX
        run: npx electron-builder --win appx --publish never --config electron-builder.config.js

      - name: Verify package output
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path 'dist-release' -Recurse -Include '*.appx','*.appxbundle','*.msix','*.msixbundle' -File)
          if ($packages.Count -eq 0) {
            Write-Error "No Store package was created."
            exit 1
          }

          foreach ($package in $packages) {
            Write-Host "Created Store package: $($package.FullName)"
          }

      - name: Verify Store manifest
        # The submission must carry exactly one restricted capability
        # (runFullTrust) and the Daylens StartupTask from
        # build/win/store/AppxManifest.xml, not electron-builder's default.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem -Path 'dist-release' -Filter '*.appx' -File | Select-Object -First 1
          if (-not $package) { Write-Error "No .appx to inspect."; exit 1 }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entry = $zip.GetEntry('AppxManifest.xml')
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $text = $reader.ReadToEnd()
            $reader.Close()
          } finally {
            $zip.Dispose()
          }
          New-Item -ItemType Directory -Force -Path 'dist-release/manifest' | Out-Null
          Set-Content -Path 'dist-release/manifest/AppxManifest.xml' -Value $text
          [xml]$manifest = $text
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace('m', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $ns.AddNamespace('uap5', 'http://schemas.microsoft.com/appx/manifest/uap/windows10/5')
          $ns.AddNamespace('uap10', 'http://schemas.microsoft.com/appx/manifest/uap/windows10/10')
          $ns.AddNamespace('rescap', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities')
          $caps = @($manifest.SelectNodes('/m:Package/m:Capabilities/*', $ns) | ForEach-Object { "$($_.Prefix):$($_.Name)" })
          Write-Host "Capabilities: $($caps -join ', ')"
          if ($caps.Count -ne 1 -or $caps[0] -ne 'rescap:runFullTrust') {
            Write-Error "Expected only rescap:runFullTrust, got: $($caps -join ', ')"
            exit 1
          }
          $tasks = @($manifest.SelectNodes('//uap5:StartupTask', $ns))
          if ($tasks.Count -ne 1 -or $tasks[0].TaskId -ne 'DaylensStartup') {
            Write-Error "Expected one StartupTask with TaskId DaylensStartup."
            exit 1
          }
          $parameters = $tasks[0].ParentNode.GetAttribute('Parameters', 'http://schemas.microsoft.com/appx/manifest/uap/windows10/10')
          if ($parameters -ne '--hidden') {
            Write-Error "StartupTask must pass --hidden, got '$parameters'."
            exit 1
          }
          Write-Host "StartupTask: $($tasks[0].TaskId) (Enabled=$($tasks[0].Enabled), Parameters=$parameters)"
          $app = $manifest.SelectSingleNode('/m:Package/m:Applications/m:Application', $ns)
          Write-Host "Application: $($app.Id) -> $($app.Executable)"
          Write-Host "Identity: $($manifest.Package.Identity.Name) / $($manifest.Package.Identity.Publisher) / $($manifest.Package.Identity.Version)"

      - name: Upload Store submission package
        uses: actions/upload-artifact@v6
        with:
          name: daylens-windows-store-${{ inputs.version }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            dist-release/*.appx
            dist-release/*.appxbundle
            dist-release/*.msix
            dist-release/*.msixbundle
            dist-release/manifest/AppxManifest.xml
